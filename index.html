<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>圖形分割 (Shape Partitioning) - 數學互動學習工具</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#faf5ff',
              100: '#f3e8ff',
              200: '#e9d5ff',
              300: '#d8b4fe',
              400: '#c084fc',
              500: '#a855f7',
              600: '#8e63b8',
              700: '#7e22ce',
              800: '#5c328b',
              900: '#3c2e4d',
              bg: '#f6f2fa',
            }
          },
          fontFamily: {
            sans: ['"Noto Sans TC"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    * { touch-action: manipulation; }
    body { background-color: #f6f2fa; font-family: 'Noto Sans TC', sans-serif; user-select: none; -webkit-user-select: none; }
    .canvas-card { background: #ffffff; border: 2px solid #e9d5ff; box-shadow: 0 10px 25px -5px rgba(142, 99, 184, 0.12); }
    canvas { touch-action: none; }
    input[type=range] { accent-color: #8e63b8; }
  </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col antialiased">

  <!-- HEADER -->
  <header class="bg-gradient-to-r from-brand-600 to-brand-700 text-white shadow-md sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-3 py-3 flex items-center justify-between gap-2">
      <div class="flex items-center space-x-2.5">
        <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-white/20 backdrop-blur-md flex items-center justify-center text-lg sm:text-xl shadow-inner">
          <i class="fa-solid fa-shapes"></i>
        </div>
        <div>
          <h1 class="text-base sm:text-xl font-black tracking-wide leading-tight">圖形分割 Shape Partitioning</h1>
          <p class="text-[10px] sm:text-xs text-brand-100 font-medium">平面圖形切割、命名與幾何結構探索</p>
        </div>
      </div>

      <!-- Top Action Controls -->
      <div class="flex items-center gap-1.5">
        <button onclick="toggleGrid()" id="grid-toggle-btn" class="px-2.5 py-1.5 bg-white/15 hover:bg-white/25 active:scale-95 rounded-lg text-xs font-bold transition flex items-center gap-1">
          <i class="fa-solid fa-border-all"></i>
          <span id="grid-type-text" class="hidden sm:inline">方格紙</span>
        </button>
        <button onclick="toggleSound()" id="sound-btn" class="w-8 h-8 sm:w-9 sm:h-9 bg-white/15 hover:bg-white/25 active:scale-95 rounded-lg text-xs flex items-center justify-center transition">
          <i class="fa-solid fa-volume-high" id="sound-icon"></i>
        </button>
        <button onclick="openHelpModal()" class="w-8 h-8 sm:w-9 sm:h-9 bg-white/20 hover:bg-white/30 active:scale-95 rounded-lg text-xs flex items-center justify-center transition">
          <i class="fa-solid fa-circle-question"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN WRAPPER -->
  <main class="flex-1 max-w-6xl w-full mx-auto p-2.5 sm:p-4 grid grid-cols-1
