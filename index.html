<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>圖形分割 (Shape Partitioning) - 數學互動學習工具</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#faf5ff',
              100: '#f3e8ff',
              200: '#e9d5ff',
              300: '#d8b4fe',
              400: '#c084fc',
              500: '#a855f7',
              600: '#8e63b8',
              700: '#7e22ce',
              800: '#5c328b',
              900: '#3c2e4d',
              bg: '#f6f2fa',
            }
          },
          fontFamily: {
            sans: ['"Noto Sans TC"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    * { touch-action: manipulation; }
    body { background-color: #f6f2fa; font-family: 'Noto Sans TC', sans-serif; user-select: none; -webkit-user-select: none; }
    .canvas-card { background: #ffffff; border: 2px solid #e9d5ff; box-shadow: 0 10px 25px -5px rgba(142, 99, 184, 0.12); }
    canvas { touch-action: none; }
    input[type=range] { accent-color: #8e63b8; }
  </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col antialiased">

  <!-- HEADER -->
  <header class="bg-gradient-to-r from-brand-600 to-brand-700 text-white shadow-md sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-3 py-3 flex items-center justify-between gap-2">
      <div class="flex items-center space-x-2.5">
        <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-white/20 backdrop-blur-md flex items-center justify-center text-lg sm:text-xl shadow-inner">
          <i class="fa-solid fa-shapes"></i>
        </div>
        <div>
          <h1 class="text-base sm:text-xl font-black tracking-wide leading-tight">圖形分割 Shape Partitioning</h1>
          <p class="text-[10px] sm:text-xs text-brand-100 font-medium">平面圖形切割、命名與幾何結構探索</p>
        </div>
      </div>

      <!-- Top Action Controls -->
      <div class="flex items-center gap-1.5">
        <button onclick="toggleGrid()" id="grid-toggle-btn" class="px-2.5 py-1.5 bg-white/15 hover:bg-white/25 active:scale-95 rounded-lg text-xs font-bold transition flex items-center gap-1">
          <i class="fa-solid fa-border-all"></i>
          <span id="grid-type-text" class="hidden sm:inline">方格紙</span>
        </button>
        <button onclick="toggleSound()" id="sound-btn" class="w-8 h-8 sm:w-9 sm:h-9 bg-white/15 hover:bg-white/25 active:scale-95 rounded-lg text-xs flex items-center justify-center transition">
          <i class="fa-solid fa-volume-high" id="sound-icon"></i>
        </button>
        <button onclick="openHelpModal()" class="w-8 h-8 sm:w-9 sm:h-9 bg-white/20 hover:bg-white/30 active:scale-95 rounded-lg text-xs flex items-center justify-center transition">
          <i class="fa-solid fa-circle-question"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN WRAPPER -->
  <main class="flex-1 max-w-6xl w-full mx-auto p-2.5 sm:p-4 grid grid-cols-1 lg:grid-cols-12 gap-3 sm:gap-4">

    <!-- LEFT TOOLBAR PANEL -->
    <section class="lg:col-span-4 flex flex-col gap-3">
      <!-- MODE SELECTION CARD -->
      <div class="bg-white rounded-2xl p-3 sm:p-4 border border-brand-200 shadow-sm">
        <h2 class="text-xs font-bold text-brand-800 uppercase tracking-wider mb-2 flex items-center gap-1.5">
          <i class="fa-solid fa-sliders text-brand-600"></i> 1. 操作模式 Mode
        </h2>
        <div class="grid grid-cols-2 gap-2">
          <button id="mode-cut-btn" onclick="setMode('cut')" class="p-2.5 rounded-xl border-2 transition-all flex flex-col items-center justify-center gap-1 bg-brand-50 border-brand-600 text-brand-800 font-bold shadow-xs active:scale-95">
            <i class="fa-solid fa-scissors text-base text-brand-600"></i>
            <span class="text-xs">✂️ 畫線分割</span>
          </button>
          <button id="mode-draw-btn" onclick="setMode('draw')" class="p-2.5 rounded-xl border-2 transition-all flex flex-col items-center justify-center gap-1 border-slate-200 hover:border-brand-300 text-slate-700 bg-white font-bold active:scale-95">
            <i class="fa-solid fa-pen-ruler text-base text-slate-500"></i>
            <span class="text-xs">✏️ 自訂底圖</span>
          </button>
        </div>
      </div>

      <!-- PRESET SHAPES CARD -->
      <div id="presets-card" class="bg-white rounded-2xl p-3 sm:p-4 border border-brand-200 shadow-sm">
        <h2 class="text-xs font-bold text-brand-800 uppercase tracking-wider mb-2 flex items-center justify-between">
          <span class="flex items-center gap-1.5"><i class="fa-solid fa-shapes text-brand-600"></i> 2. 課本常見預設圖形</span>
        </h2>
        <div class="grid grid-cols-2 gap-1.5 sm:gap-2">
          <button onclick="loadPreset('rectangle')" class="p-2 rounded-xl border border-brand-200 hover:bg-brand-50 transition flex items-center gap-2 bg-white">
            <div class="w-6 h-6 rounded-md bg-blue-100 text-blue-700 flex items-center justify-center text-xs font-bold"><i class="fa-regular fa-rectangle-wide"></i></div>
            <span class="text-xs font-bold text-slate-700">長方形</span>
          </button>
          <button onclick="loadPreset('square')" class="p-2 rounded-xl border border-brand-200 hover:bg-brand-50 transition flex items-center gap-2 bg-white">
            <div class="w-6 h-6 rounded-md bg-amber-100 text-amber-700 flex items-center justify-center text-xs font-bold"><i class="fa-regular fa-square"></i></div>
            <span class="text-xs font-bold text-slate-700">正方形</span>
          </button>
          <button onclick="loadPreset('parallelogram')" class="p-2 rounded-xl border border-brand-200 hover:bg-brand-50 transition flex items-center gap-2 bg-white">
            <div class="w-6 h-6 rounded-md bg-emerald-100 text-emerald-700 flex items-center justify-center text-xs font-bold"><i class="fa-solid fa-vector-square"></i></div>
            <span class="text-xs font-bold text-slate-700">平行四邊形</span>
          </button>
          <button onclick="loadPreset('trapezoid')" class="p-2 rounded-xl border border-brand-200 hover:bg-brand-50 transition flex items-center gap-2 bg-white">
            <div class="w-6 h-6 rounded-md bg-purple-100 text-purple-700 flex items-center justify-center text-xs font-bold"><i class="fa-solid fa-draw-polygon"></i></div>
            <span class="text-xs font-bold text-slate-700">梯形</span>
          </button>
          <button onclick="loadPreset('rhombus')" class="p-2 rounded-xl border border-brand-200 hover:bg-brand-50 transition flex items-center gap-2 bg-white">
            <div class="w-6 h-6 rounded-md bg-pink-100 text-pink-700 flex items-center justify-center text-xs font-bold"><i class="fa-solid fa-diamond"></i></div>
            <span class="text-xs font-bold text-slate-700">菱形</span>
          </button>
          <button onclick="loadPreset('triangle')" class="p-2 rounded-xl border border-brand-200 hover:bg-brand-50 transition flex items-center gap-2 bg-white">
            <div class="w-6 h-6 rounded-md bg-rose-100 text-rose-700 flex items-center justify-center text-xs font-bold"><i class="fa-solid fa-play -rotate-90"></i></div>
            <span class="text-xs font-bold text-slate-700">三角形</span>
          </button>
          <button onclick="loadPreset('hexagon')" class="p-2 rounded-xl border border-brand-200 hover:bg-brand-50 transition flex items-center gap-2 bg-white">
            <div class="w-6 h-6 rounded-md bg-indigo-100 text-indigo-700 flex items-center justify-center text-xs font-bold"><i class="fa-solid fa-cube"></i></div>
            <span class="text-xs font-bold text-slate-700">正六邊形</span>
          </button>
          <button onclick="loadPreset('lshape')" class="p-2 rounded-xl border border-brand-200 hover:bg-brand-50 transition flex items-center gap-2 bg-white">
            <div class="w-6 h-6 rounded-md bg-teal-100 text-teal-700 flex items-center justify-center text-xs font-bold"><i class="fa-solid fa-L"></i></div>
            <span class="text-xs font-bold text-slate-700">L形多邊形</span>
          </button>
        </div>
      </div>

      <!-- SEPARATION SLIDER -->
      <div class="bg-gradient-to-br from-brand-50 to-white rounded-2xl p-3 sm:p-4 border border-brand-200 shadow-sm">
        <div class="flex items-center justify-between mb-1">
          <label for="separation-slider" class="text-xs font-bold text-brand-900 flex items-center gap-1.5">
            <i class="fa-solid fa-arrows-split-up-and-left text-brand-600"></i>
            <span>圖形分離拉桿 (爆炸視圖)</span>
          </label>
          <span id="separation-val-display" class="text-xs font-black px-2 py-0.5 bg-brand-200 text-brand-
