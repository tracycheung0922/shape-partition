  <!-- MAIN JAVASCRIPT LOGIC -->
  <script>
    const GRID_COLS = 16;
    const GRID_ROWS = 12;

    const PASTEL_COLORS = [
      'rgba(134, 239, 172, 0.6)',  // 淡綠 (長方形 1)
      'rgba(147, 197, 253, 0.6)',  // 淡藍 (長方形 2)
      'rgba(216, 180, 254, 0.6)',  // 淡紫 (長方形 3)
      'rgba(253, 224, 71, 0.6)',   // 淡黃
      'rgba(253, 186, 116, 0.6)',  // 淡橙
      'rgba(244, 114, 182, 0.6)',  // 淡粉
      'rgba(167, 243, 208, 0.6)',
      'rgba(192, 132, 252, 0.6)'
    ];

    let state = {
      mode: 'cut',
      gridType: 'square',
      soundEnabled: true,
      separation: 0,
      basePolygons: [],
      partitionLines: [],
      customDrawPoints: [],
      selectedStartPoint: null,
      hoverSnapInfo: null,
    };

    let canvas, ctx;
    let canvasWidth, canvasHeight;
    let gridStepX, gridStepY;
    let offsetX = 0, offsetY = 0;

    window.onload = function() {
      canvas = document.getElementById('math-canvas');
      ctx = canvas.getContext('2d');
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);
      setupInteractionEvents();
      loadPreset('three_rectangles');
    };

    function resizeCanvas() {
      const container = canvas.parentElement;
      const rect = container.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;

      canvasWidth = rect.width;
      canvasHeight = rect.height;

      canvas.width = canvasWidth * dpr;
      canvas.height = canvasHeight * dpr;
      ctx.scale(dpr, dpr);

      const step = Math.min(canvasWidth / (GRID_COLS + 2), canvasHeight / (GRID_ROWS + 2));
      gridStepX = step;
      gridStepY = step;

      offsetX = (canvasWidth - GRID_COLS * step) / 2;
      offsetY = (canvasHeight - GRID_ROWS * step) / 2;

      render();
    }

    function gridToPixel(gx, gy) {
      return {
        x: offsetX + gx * gridStepX,
        y: offsetY + gy * gridStepY
      };
    }

    function getSmartSnapPoint(px, py) {
      const rawGridX = (px - offsetX) / gridStepX;
      const rawGridY = (py - offsetY) / gridStepY;

      const subPolygons = computeSubPolygons();

      let sceneCentroid = { x: 8, y: 6 };
      if (subPolygons.length > 0) {
        let totalX = 0, totalY = 0, totalPts = 0;
        subPolygons.forEach(sp => {
          sp.vertices.forEach(v => { totalX += v.x; totalY += v.y; totalPts++; });
        });
        sceneCentroid = { x: totalX / totalPts, y: totalY / totalPts };
      }

      let candidates = [];

      if (state.mode === 'draw' && state.customDrawPoints.length > 0) {
        state.customDrawPoints.forEach((pt, idx) => {
          candidates.push({
            realX: pt.x,
            realY: pt.y,
            visX: pt.x,
            visY: pt.y,
            type: 'vertex',
            label: idx === 0 ? '首個頂點 (點擊閉合)' : `頂點 ${idx + 1}`
          });
        });
      }

      subPolygons.forEach(sp => {
        const verts = sp.vertices;
        const pCentroid = calcPolygonCentroid(verts);
        let shiftX = 0, shiftY = 0;
        if (state.separation > 0 && subPolygons.length > 1) {
          const dirX = pCentroid.x - sceneCentroid.x;
          const dirY = pCentroid.y - sceneCentroid.y;
          const scaleFactor = (state.separation / 100) * 0.65;
          shiftX = dirX * scaleFactor;
          shiftY = dirY * scaleFactor;
        }

        const n = verts.length;
        for (let i = 0; i < n; i++) {
          const v = verts[i];
          const nextV = verts[(i + 1) % n];

          candidates.push({
            realX: v.x,
            realY: v.y,
            visX: v.x + shiftX,
            visY: v.y + shiftY,
            type: 'vertex',
            label: '頂點'
          });

          candidates.push({
            realX: (v.x + nextV.x) / 2,
            realY: (v.y + nextV.y) / 2,
            visX: (v.x + nextV.x) / 2 + shiftX,
            visY: (v.y + nextV.y) / 2 + shiftY,
            type: 'midpoint',
            label: '中點'
          });
        }
      });

      let bestDist = 0.45;
      let bestSnap = null;

      for (let cand of candidates) {
        const d = Math.hypot(cand.visX - rawGridX, cand.visY - rawGridY);
        if (d < bestDist) {
          bestDist = d;
          bestSnap = cand;
        }
      }

      if (bestSnap) {
        return {
          x: bestSnap.realX,
          y: bestSnap.realY,
          visX: bestSnap.visX,
          visY: bestSnap.visY,
          type: bestSnap.type,
          label: bestSnap.label
        };
      }

      const nearestGx = Math.max(0, Math.min(GRID_COLS, Math.round(rawGridX)));
      const nearestGy = Math.max(0, Math.min(GRID_ROWS, Math.round(rawGridY)));

      return {
        x: nearestGx,
        y: nearestGy,
        visX: nearestGx,
        visY: nearestGy,
        type: 'grid',
        label: '網格點'
      };
    }

    function loadPreset(type) {
      state.mode = 'cut';
      updateModeButtons();
      state.partitionLines = [];
      state.customDrawPoints = [];
      state.selectedStartPoint = null;
      state.separation = 0;
      document.getElementById('separation-slider').value = 0;
      document.getElementById('separation-val-display').innerText = '0%';

      switch (type) {
        case 'three_rectangles':
          state.basePolygons = [
            [{x: 2.5, y: 3}, {x: 5.5, y: 3}, {x: 5.5, y: 9}, {x: 2.5, y: 9}],
            [{x: 6.5, y: 3}, {x: 9.5, y: 3}, {x: 9.5, y: 9}, {x: 6.5, y: 9}],
            [{x: 10.5, y: 3}, {x: 13.5, y: 3}, {x: 13.5, y: 9}, {x: 10.5, y: 9}]
          ];
          break;
        case 'rectangle':
          state.basePolygons = [[{x: 4, y: 3}, {x: 12, y: 3}, {x: 12, y: 9}, {x: 4, y: 9}]];
          break;
        case 'square':
          state.basePolygons = [[{x: 5, y: 3}, {x: 11, y: 3}, {x: 11, y: 9}, {x: 5, y: 9}]];
          break;
        case 'parallelogram':
          state.basePolygons = [[{x: 6, y: 3}, {x: 13, y: 3}, {x: 10, y: 9}, {x: 3, y: 9}]];
          break;
        case 'trapezoid':
          state.basePolygons = [[{x: 6, y: 3}, {x: 10, y: 3}, {x: 13, y: 9}, {x: 3, y: 9}]];
          break;
        case 'rhombus':
          state.basePolygons = [[{x: 8, y: 2}, {x: 12, y: 6}, {x: 8, y: 10}, {x: 4, y: 6}]];
          break;
        case 'triangle':
          state.basePolygons = [[{x: 8, y: 3}, {x: 13, y: 9}, {x: 3, y: 9}]];
          break;
      }

      playSound('pop');
      render();
    }

    function calcPolygonArea(verts) {
      let area = 0;
      const n = verts.length;
      for (let i = 0; i < n; i++) {
        const j = (i + 1) % n;
        area += verts[i].x * verts[j].y;
        area -= verts[j].x * verts[i].y;
      }
      return Math.abs(area) / 2;
    }

    function calcPolygonCentroid(verts) {
      let cx = 0, cy = 0;
      verts.forEach(v => { cx += v.x; cy += v.y; });
      return { x: cx / verts.length, y: cy / verts.length };
    }

    function cleanVertices(verts) {
      if (!verts || verts.length < 3) return verts;

      let pts = [];
      const EPS_DIST = 0.15;
      for (let i = 0; i < verts.length; i++) {
        const pt = verts[i];
        if (pts.length === 0) {
          pts.push({ x: pt.x, y: pt.y });
        } else {
          const prev = pts[pts.length - 1];
          if (Math.hypot(pt.x - prev.x, pt.y - prev.y) > EPS_DIST) {
            pts.push({ x: pt.x, y: pt.y });
          }
        }
      }
      if (pts.length > 1 && Math.hypot(pts[0].x - pts[pts.length - 1].x, pts[0].y - pts[pts.length - 1].y) <= EPS_DIST) {
        pts.pop();
      }

      if (pts.length < 3) return pts;

      let changed = true;
      while (changed && pts.length >= 3) {
        changed = false;
        let newPts = [];
        const n = pts.length;

        for (let i = 0; i < n; i++) {
          const prev = pts[(i - 1 + n) % n];
          const curr = pts[i];
          const next = pts[(i + 1) % n];

          const v1 = { x: prev.x - curr.x, y: prev.y - curr.y };
          const v2 = { x: next.x - curr.x, y: next.y - curr.y };

          const mag1 = Math.hypot(v1.x, v1.y);
          const mag2 = Math.hypot(v2.x, v2.y);

          if (mag1 < EPS_DIST || mag2 < EPS_DIST) {
            changed = true;
            continue;
          }

          const cross = v1.x * v2.y - v1.y * v2.x;
          const dot = v1.x * v2.x + v1.y * v2.y;

          if (Math.abs(cross) < 0.05 && dot > 0) {
            changed = true;
            continue;
          }

          if (Math.abs(cross) < 0.05 && dot < 0) {
            changed = true;
            continue;
          }

          newPts.push(curr);
        }
        pts = newPts;
      }

      return pts;
    }

    function detectShapeName(verts) {
      const cleaned = cleanVertices(verts);
      const n = cleaned.length;

      if (n < 3) return '未知圖形';

      const sides = [];
      for (let i = 0; i < n; i++) {
        const p1 = cleaned[i];
        const p2 = cleaned[(i + 1) % n];
        sides.push(Math.hypot(p2.x - p1.x, p2.y - p1.y));
      }

      const angles = [];
      for (let i = 0; i < n; i++) {
        const prev = cleaned[(i - 1 + n) % n];
        const curr = cleaned[i];
        const next = cleaned[(i + 1) % n];

        const v1 = { x: prev.x - curr.x, y: prev.y - curr.y };
        const v2 = { x: next.x - curr.x, y: next.y - curr.y };

        const dot = v1.x * v2.x + v1.y * v2.y;
        const mag1 = Math.hypot(v1.x, v1.y);
        const mag2 = Math.hypot(v2.x, v2.y);

        let cosTheta = dot / (mag1 * mag2);
        cosTheta = Math.max(-1, Math.min(1, cosTheta));
        angles.push(Math.acos(cosTheta) * (180 / Math.PI));
      }

      if (n === 3) {
        const hasRight = angles.some(a => Math.abs(a - 90) < 3);
        if (hasRight) return '直角三角形';
        if (Math.abs(sides[0] - sides[1]) < 0.2 && Math.abs(sides[1] - sides[2]) < 0.2) return '等邊三角形';
        if (Math.abs(sides[0] - sides[1]) < 0.2 || Math.abs(sides[1] - sides[2]) < 0.2 || Math.abs(sides[0] - sides[2]) < 0.2) return '等腰三角形';
        return '三角形';
      }

      if (n === 4) {
        const rightAngles = angles.filter(a => Math.abs(a - 90) < 3).length;
        const allSidesEqual = Math.abs(sides[0] - sides[1]) < 0.2 && Math.abs(sides[1] - sides[2]) < 0.2 && Math.abs(sides[2] - sides[3]) < 0.2;

        const p0 = cleaned[0], p1 = cleaned[1], p2 = cleaned[2], p3 = cleaned[3];
        const dir01 = { x: p1.x - p0.x, y: p1.y - p0.y };
        const dir32 = { x: p2.x - p3.x, y: p2.y - p3.y };
        const dir12 = { x: p2.x - p1.x, y: p2.y - p1.y };
        const dir03 = { x: p3.x - p0.x, y: p3.y - p0.y };

        const parallel1 = Math.abs(dir01.x * dir32.y - dir01.y * dir32.x) < 0.25;
        const parallel2 = Math.abs(dir12.x * dir03.y - dir12.y * dir03.x) < 0.25;

        if (parallel1 && parallel2) {
          if (rightAngles >= 3) {
            return allSidesEqual ? '正方形' : '長方形';
          } else {
            return allSidesEqual ? '菱形' : '平行四邊形';
          }
        } else if (parallel1 || parallel2) {
          return '梯形';
        } else {
          return '四邊形';
        }
      }

      if (n === 5) return '五邊形';
      if (n === 6) return '六邊形';
      return `${n}邊形`;
    }

    function computeSubPolygons() {
      const baseList = state.basePolygons && state.basePolygons.length > 0 
        ? state.basePolygons 
        : [];

      if (baseList.length === 0) return [];
      if (state.partitionLines.length === 0) {
        return baseList.map(poly => ({ vertices: poly, name: detectShapeName(poly) }));
      }

      let currentPolygons = baseList.map(poly => ({ vertices: poly }));

      state.partitionLines.forEach(line => {
        let nextPolygons = [];
        currentPolygons.forEach(item => {
          const splits = sliceSinglePolygonSegment(item.vertices, line.p1, line.p2);
          splits.forEach(v => {
            nextPolygons.push({ vertices: v });
          });
        });
        currentPolygons = nextPolygons;
      });

      return currentPolygons.map(item => ({
        vertices: item.vertices,
        name: detectShapeName(item.vertices)
      }));
    }

    function snapIntersection(ix, iy, verts, threshold = 0.25) {
      for (let v of verts) {
        if (Math.hypot(ix - v.x, iy - v.y) < threshold) {
          return { x: v.x, y: v.y };
        }
      }
      const rx = Math.round(ix);
      const ry = Math.round(iy);
      if (Math.hypot(ix - rx, iy - ry) < threshold) {
        return { x: rx, y: ry };
      }
      return { x: ix, y: iy };
    }

    /* 核心修復：劃線段區域切割演算法 (Segment-Bounded Cut) */
    function sliceSinglePolygonSegment(verts, lineP1, lineP2) {
      const A = lineP2.y - lineP1.y;
      const B = lineP1.x - lineP2.x;
      const C = lineP2.x * lineP1.y - lineP1.x * lineP2.y;

      const lenSq = A * A + B * B;
      if (lenSq < 1e-9) return [verts];

      const dist = (p) => A * p.x + B * p.y + C;
      const EPS = 1e-4;

      const dists = verts.map(p => dist(p));

      let hasPos = false, hasNeg = false;
      for (let d of dists) {
        if (d > EPS) hasPos = true;
        if (d < -EPS) hasNeg = true;
      }

      // 若所有頂點皆在線的同側，表示該圖形未被劃穿，保持原樣
      if (!hasPos || !hasNeg) return [verts];

      const ring = [];
      const n = verts.length;
      const uVals = [];

      const dx = lineP2.x - lineP1.x;
      const dy = lineP2.y - lineP1.y;

      for (let i = 0; i < n; i++) {
        const curr = verts[i];
        const next = verts[(i + 1) % n];
        const dCurr = dists[i];
        const dNext = dists[(i + 1) % n];

        ring.push({ x: curr.x, y: curr.y });

        if ((dCurr > EPS && dNext < -EPS) || (dCurr < -EPS && dNext > EPS)) {
          const t = dCurr / (dCurr - dNext);
          let ix = curr.x + t * (next.x - curr.x);
          let iy = curr.y + t * (next.y - curr.y);
          
          const snapped = snapIntersection(ix, iy, verts);
          ring.push(snapped);

          // 計算交點在劃線段 [p1, p2] 上的參數 u (0~1 之間代表在劃線段範圍內)
          const u = ((snapped.x - lineP1.x) * dx + (snapped.y - lineP1.y) * dy) / lenSq;
          uVals.push(u);
        }
      }

      // 檢查劃線段 [p1, p2] 是否真的穿越了該圖形的交點區域
      if (uVals.length >= 2) {
        const uMin = Math.min(...uVals);
        const uMax = Math.max(...uVals);
        const TOL = 0.12; // 邊界磁吸容許值
        if (Math.max(0, uMin) > Math.min(1, uMax) + TOL) {
          // 劃線段並未到達此圖形，不切割此圖形
          return [verts];
        }
      }

      const left = [], right = [];
      for (let pt of ring) {
        const d = dist(pt);
        if (d >= -EPS) left.push({ x: pt.x, y: pt.y });
        if (d <= EPS) right.push({ x: pt.x, y: pt.y });
      }

      const cleanLeft = cleanVertices(left);
      const cleanRight = cleanVertices(right);

      const res = [];
      if (cleanLeft.length >= 3 && calcPolygonArea(cleanLeft) > 0.08) res.push(cleanLeft);
      if (cleanRight.length >= 3 && calcPolygonArea(cleanRight) > 0.08) res.push(cleanRight);

      return res.length > 0 ? res : [verts];
    }

    function render() {
      ctx.clearRect(0, 0, canvasWidth, canvasHeight);

      drawGrid();

      const subPolygons = computeSubPolygons();

      let sceneCentroid = { x: 8, y: 6 };
      if (subPolygons.length > 0) {
        let totalX = 0, totalY = 0, totalPts = 0;
        subPolygons.forEach(sp => {
          sp.vertices.forEach(v => { totalX += v.x; totalY += v.y; totalPts++; });
        });
        sceneCentroid = { x: totalX / totalPts, y: totalY / totalPts };
      }

      // 1. 繪製切割圖形
      subPolygons.forEach((poly, idx) => {
        const pCentroid = calcPolygonCentroid(poly.vertices);

        let shiftX = 0, shiftY = 0;
        if (state.separation > 0 && subPolygons.length > 1) {
          const dirX = pCentroid.x - sceneCentroid.x;
          const dirY = pCentroid.y - sceneCentroid.y;
          const scaleFactor = (state.separation / 100) * 0.65;
          shiftX = dirX * scaleFactor;
          shiftY = dirY * scaleFactor;
        }

        ctx.save();
        ctx.beginPath();
        poly.vertices.forEach((v, vIdx) => {
          const px = gridToPixel(v.x + shiftX, v.y + shiftY);
          if (vIdx === 0) ctx.moveTo(px.x, px.y);
          else ctx.lineTo(px.x, px.y);
        });
        ctx.closePath();

        ctx.fillStyle = PASTEL_COLORS[idx % PASTEL_COLORS.length];
        ctx.fill();

        ctx.strokeStyle = '#5c328b';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        // 標籤動態大小
        const centPx = gridToPixel(pCentroid.x + shiftX, pCentroid.y + shiftY);
        const polyArea = calcPolygonArea(poly.vertices);
        const fontPx = polyArea < 1.5 ? 10 : 12;
        const padY = polyArea < 1.5 ? 6 : 9;
        const padX = polyArea < 1.5 ? 4 : 6;

        ctx.font = `bold ${fontPx}px "Noto Sans TC", sans-serif`;
        const labelText = poly.name;
        const textWidth = ctx.measureText(labelText).width;

        ctx.fillStyle = 'rgba(255, 255, 255, 0.92)';
        ctx.beginPath();
        ctx.roundRect(centPx.x - textWidth/2 - padX, centPx.y - padY, textWidth + padX * 2, padY * 2, 4);
        ctx.fill();
        ctx.strokeStyle = 'rgba(142, 99, 184, 0.4)';
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.fillStyle = '#3c2e4d';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(labelText, centPx.x, centPx.y);

        ctx.restore();
      });

      // 2. 自訂底圖模式點擊線
      if (state.mode === 'draw' && state.customDrawPoints.length > 0) {
        ctx.save();
        ctx.beginPath();
        state.customDrawPoints.forEach((pt, idx) => {
          const px = gridToPixel(pt.x, pt.y);
          if (idx === 0) ctx.moveTo(px.x, px.y);
          else ctx.lineTo(px.x, px.y);
        });

        if (state.hoverSnapInfo) {
          const mPx = gridToPixel(state.hoverSnapInfo.visX, state.hoverSnapInfo.visY);
          ctx.lineTo(mPx.x, mPx.y);
        }

        ctx.strokeStyle = '#8e63b8';
        ctx.lineWidth = 2.5;
        ctx.setLineDash([5, 5]);
        ctx.stroke();

        state.customDrawPoints.forEach((pt, idx) => {
          const px = gridToPixel(pt.x, pt.y);
          ctx.beginPath();
          ctx.arc(px.x, px.y, 6, 0, Math.PI * 2);
          ctx.fillStyle = (idx === 0 && state.customDrawPoints.length >= 3) ? '#e11d48' : '#8e63b8';
          ctx.fill();
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 2;
          ctx.stroke();
        });
        ctx.restore();
      }

      // 3. 顯示劃出的切割線
      if (state.partitionLines.length > 0 && state.separation === 0) {
        ctx.save();
        ctx.strokeStyle = '#8e63b8';
        ctx.lineWidth = 3;
        ctx.setLineDash([6, 4]);
        state.partitionLines.forEach(line => {
          const p1 = gridToPixel(line.p1.x, line.p1.y);
          const p2 = gridToPixel(line.p2.x, line.p2.y);
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.stroke();
        });
        ctx.restore();
      }

      // 4. 切割預覽線
      if (state.selectedStartPoint && state.hoverSnapInfo && state.mode === 'cut') {
        ctx.save();
        const p1 = gridToPixel(state.selectedStartPoint.x, state.selectedStartPoint.y);
        const p2 = gridToPixel(state.hoverSnapInfo.visX, state.hoverSnapInfo.visY);

        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.strokeStyle = '#e11d48';
        ctx.lineWidth = 2.5;
        ctx.setLineDash([4, 4]);
        ctx.stroke();

        [p1, p2].forEach(p => {
          ctx.beginPath();
          ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
          ctx.fillStyle = '#e11d48';
          ctx.fill();
        });
        ctx.restore();
      }

      // 5. 磁吸游標提示
      if (state.hoverSnapInfo) {
        const snap = state.hoverSnapInfo;
        const px = gridToPixel(snap.visX, snap.visY);

        ctx.save();
        ctx.beginPath();
        ctx.arc(px.x, px.y, 8, 0, Math.PI * 2);

        if (snap.type === 'vertex') {
          ctx.fillStyle = 'rgba(34, 197, 94, 0.4)';
          ctx.strokeStyle = '#16a34a';
        } else if (snap.type === 'midpoint') {
          ctx.fillStyle = 'rgba(6, 182, 212, 0.4)';
          ctx.strokeStyle = '#0891b2';
        } else {
          ctx.fillStyle = 'rgba(142, 99, 184, 0.3)';
          ctx.strokeStyle = '#8e63b8';
        }

        ctx.fill();
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.font = 'bold 10px "Noto Sans TC", sans-serif';
        const tagText = snap.label;
        const tagW = ctx.measureText(tagText).width;
        ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
        ctx.roundRect(px.x - tagW/2 - 4, px.y - 22, tagW + 8, 14, 4);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(tagText, px.x, px.y - 15);

        ctx.restore();
      }

      updateAnalysisCard(subPolygons);
    }

    function drawGrid() {
      ctx.save();
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvasWidth, canvasHeight);

      if (state.gridType === 'none') {
        ctx.restore();
        return;
      }

      ctx.strokeStyle = '#f1e8fc';
      ctx.lineWidth = 1.2;

      for (let col = 0; col <= GRID_COLS; col++) {
        const p1 = gridToPixel(col, 0);
        const p2 = gridToPixel(col, GRID_ROWS);
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
      }

      for (let row = 0; row <= GRID_ROWS; row++) {
        const p1 = gridToPixel(0, row);
        const p2 = gridToPixel(GRID_COLS, row);
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
      }

      ctx.fillStyle = '#c084fc';
      for (let col = 0; col <= GRID_COLS; col++) {
        for (let row = 0; row <= GRID_ROWS; row++) {
          const p = gridToPixel(col, row);
          ctx.beginPath();
          ctx.arc(p.x, p.y, 1.5, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.restore();
    }

    function setupInteractionEvents() {
      canvas.addEventListener('mousedown', handlePointerDown);
      canvas.addEventListener('mousemove', handlePointerMove);

      canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        handlePointerDown(e.touches[0]);
      }, { passive: false });

      canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        handlePointerMove(e.touches[0]);
      }, { passive: false });
    }

    function getCanvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top
      };
    }

    function handlePointerDown(e) {
      const pxPt = getCanvasCoords(e);

      if (state.mode === 'cut' && state.separation > 0) {
        state.separation = 0;
        document.getElementById('separation-slider').value = 0;
        document.getElementById('separation-val-display').innerText = '0%';
      }

      const snap = getSmartSnapPoint(pxPt.x, pxPt.y);

      if (state.mode === 'cut') {
        if (!state.selectedStartPoint) {
          state.selectedStartPoint = { x: snap.x, y: snap.y };
          playSound('click');
        } else {
          if (state.selectedStartPoint.x !== snap.x || state.selectedStartPoint.y !== snap.y) {
            state.partitionLines.push({
              p1: state.selectedStartPoint,
              p2: { x: snap.x, y: snap.y }
            });
            playSound('slice');
          }
          state.selectedStartPoint = null;
        }
      } else if (state.mode === 'draw') {
        if (state.customDrawPoints.length >= 3) {
          const firstPt = state.customDrawPoints[0];
          if (Math.hypot(firstPt.x - snap.x, firstPt.y - snap.y) < 0.3) {
            state.basePolygons = [[...state.customDrawPoints]];
            state.customDrawPoints = [];
            setMode('cut');
            playSound('pop');
            render();
            return;
          }
        }
        state.customDrawPoints.push({ x: snap.x, y: snap.y });
        playSound('click');
      }

      render();
    }

    function handlePointerMove(e) {
      const pxPt = getCanvasCoords(e);
      state.hoverSnapInfo = getSmartSnapPoint(pxPt.x, pxPt.y);
      render();
    }

    function setMode(mode) {
      state.mode = mode;
      state.selectedStartPoint = null;
      if (mode === 'draw') {
        state.basePolygons = [];
        state.partitionLines = [];
        state.customDrawPoints = [];
      }
      updateModeButtons();
      playSound('click');
      render();
    }

    function updateModeButtons() {
      const cutBtn = document.getElementById('mode-cut-btn');
      const drawBtn = document.getElementById('mode-draw-btn');
      const statusText = document.getElementById('status-text');

      if (state.mode === 'cut') {
        cutBtn.className = 'p-2.5 rounded-xl border-2 transition-all flex flex-col items-center justify-center gap-1 bg-brand-50 border-brand-600 text-brand-800 font-bold shadow-xs active:scale-95';
        drawBtn.className = 'p-2.5 rounded-xl border-2 transition-all flex flex-col items-center justify-center gap-1 border-slate-200 hover:border-brand-300 text-slate-700 bg-white font-bold active:scale-95';
        statusText.innerText = '提示：請在網格上點擊或觸控兩點劃出分割線 (劃線僅會分割該線段穿越的圖形)';
      } else {
        drawBtn.className = 'p-2.5 rounded-xl border-2 transition-all flex flex-col items-center justify-center gap-1 bg-brand-50 border-brand-600 text-brand-800 font-bold shadow-xs active:scale-95';
        cutBtn.className = 'p-2.5 rounded-xl border-2 transition-all flex flex-col items-center justify-center gap-1 border-slate-200 hover:border-brand-300 text-slate-700 bg-white font-bold active:scale-95';
        statusText.innerText = '提示：請依序點擊網格頂點繪製，最後點擊第一個頂點即可閉合圖形';
      }
    }

    function clearPartitionLines() {
      state.partitionLines = [];
      state.selectedStartPoint = null;
      playSound('click');
      render();
    }

    function resetCanvas() {
      loadPreset('three_rectangles');
    }

    function updateSeparation(val) {
      state.separation = parseInt(val);
      document.getElementById('separation-val-display').innerText = `${val}%`;
      render();
    }

    function toggleGrid() {
      state.gridType = state.gridType === 'square' ? 'none' : 'square';
      document.getElementById('grid-type-text').innerText = state.gridType === 'square' ? '方格紙' : '無網格';
      playSound('click');
      render();
    }

    function toggleSound() {
      state.soundEnabled = !state.soundEnabled;
      document.getElementById('sound-icon').className = state.soundEnabled ? 'fa-solid fa-volume-high' : 'fa-solid fa-volume-xmark text-rose-300';
    }

    function updateAnalysisCard(subPolygons) {
      document.getElementById('shape-count-badge').innerText = `${subPolygons.length} 個圖形`;
      document.getElementById('piece-total-count').innerText = `共 ${subPolygons.length} 個圖形`;

      const container = document.getElementById('analysis-output');

      if (state.mode === 'draw' && state.customDrawPoints.length > 0) {
        container.innerHTML = `正自訂繪製中（已點擊 <strong class="text-brand-800">${state.customDrawPoints.length}</strong> 個頂點）……請點擊首個頂點閉合圖形。`;
        return;
      }

      if (state.partitionLines.length === 0) {
        container.innerHTML = `當前圖形總數為：<strong class="text-brand-800 font-bold">${subPolygons.length} 個圖形</strong>。請在目標圖形上劃線分割！`;
        return;
      }

      const counts = {};
      subPolygons.forEach(p => {
        counts[p.name] = (counts[p.name] || 0) + 1;
      });

      let html = `<div class="font-bold text-brand-900 mb-1.5">成功分割成 ${subPolygons.length} 個圖形：</div><div class="flex flex-wrap gap-1.5">`;
      for (let [name, count] of Object.entries(counts)) {
        html += `<span class="px-2.5 py-1 bg-white border border-brand-300 text-brand-900 font-bold rounded-lg text-xs shadow-2xs">${count} 個 ${name}</span>`;
      }
      html += `</div>`;

      container.innerHTML = html;
    }

    function playSound(type) {
      if (!state.soundEnabled) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const audioCtx = new AudioCtx();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;
        if (type === 'click') {
          osc.frequency.setValueAtTime(400, now);
          osc.frequency.exponentialRampToValueAtTime(200, now + 0.05);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
          osc.start(now);
          osc.stop(now + 0.05);
        } else if (type === 'slice') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(700, now);
          osc.frequency.exponentialRampToValueAtTime(150, now + 0.12);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
          osc.start(now);
          osc.stop(now + 0.12);
        } else if (type === 'pop') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(300, now);
          osc.frequency.exponentialRampToValueAtTime(600, now + 0.08);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
          osc.start(now);
          osc.stop(now + 0.08);
        }
      } catch (e) {}
    }

    function openHelpModal() { document.getElementById('help-modal').classList.remove('hidden'); }
    function closeHelpModal() { document.getElementById('help-modal').classList.add('hidden'); }
    function fitCanvasView() { resizeCanvas(); }
    function exportSnapshot() {
      const link = document.createElement('a');
      link.download = `圖形分割成果_${Date.now()}.png`;
      link.href = canvas.toDataURL();
      link.click();
    }
  </script>
</body>
